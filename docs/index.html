<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>要保書險種辨識</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e3e6eb;--accent:#2563eb;--ok:#15803d;--okbg:#e8f6ec;--warn:#b45309;--warnbg:#fdf3e3;--bad:#b91c1c;--badbg:#fdecec}
  @media (prefers-color-scheme: dark){:root{--bg:#14161a;--card:#1d2026;--text:#e6e8ec;--muted:#9aa1ac;--line:#2e323a;--accent:#60a5fa;--ok:#4ade80;--okbg:#16301f;--warn:#fbbf24;--warnbg:#352a12;--bad:#f87171;--badbg:#3a1a1a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
  main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:14px}
  section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  h2{font-size:16px;margin:0 0 12px}
  #drop{border:2px dashed var(--line);border-radius:10px;padding:32px 16px;text-align:center;cursor:pointer;color:var(--muted)}
  #drop.hover{border-color:var(--accent);color:var(--accent)}
  button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600}
  input[type=text]{font:inherit;width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
  .code{font-family:Consolas,monospace;font-weight:700}
  .tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;white-space:nowrap}
  .ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted);font-size:13px}
  .snip{font-size:12px;color:var(--muted);max-width:280px;word-break:break-all}
  mark{background:#fde68a;color:#000;border-radius:2px}
  details pre{white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:240px;overflow:auto;background:var(--bg);padding:8px;border-radius:6px}
  .tbl-wrap{overflow-x:auto}
  label.chk{display:flex;gap:6px;align-items:center;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>要保書險種辨識</h1>
  <p class="sub">上傳要保書 PDF，自動辨識險種並帶入編碼。文字型 PDF 直接讀取，掃描檔改用 OCR（繁體中文）。所有處理都在你的電腦上進行，檔案不會上傳。</p>

  <section>
    <h2>1. 上傳 PDF</h2>
    <div id="drop">把 PDF 拖到這裡，或點一下選擇檔案（可多選）<input id="file" type="file" accept="application/pdf" multiple hidden></div>
    <div class="row" style="margin-top:10px">
      <label class="chk"><input type="checkbox" id="forceOcr"> 一律使用 OCR（文字型 PDF 讀出亂碼時勾選）</label>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="chk">編碼填入欄位：<input type="text" id="fieldLabel" value="保險單號碼" style="width:140px"></label>
      <label class="chk">字級：<input type="text" id="fontSize" value="10" style="width:50px"></label>
    </div>
    <p id="status" class="muted" style="margin:8px 0 0"></p>
  </section>

  <section>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">2. 辨識結果</h2>
      <div class="row"><button id="exportCsv" disabled>匯出 Excel (CSV)</button><button id="clear">清除結果</button></div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>頁</th><th>險種</th><th>編碼</th><th>狀態</th><th>依據</th></tr></thead>
        <tbody id="results"><tr><td colspan="5" class="muted">尚未上傳檔案</td></tr></tbody>
      </table>
    </div>
  </section>

  <section>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">3. 險種對照表</h2>
      <div class="row">
        <button id="addRow">＋ 新增險種</button>
        <button id="exportMap">匯出對照表</button>
        <button id="importMap">匯入對照表</button>
        <input id="importFile" type="file" accept=".json,.csv" hidden>
      </div>
    </div>
    <p class="muted" style="margin-top:0">「關鍵字」用逗號分隔，要保書上出現任一個就算符合。修改後自動儲存在這台電腦的瀏覽器裡。匯入支援 JSON 或 CSV（欄位：險種,編碼,關鍵字）。</p>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th style="width:22%">險種</th><th style="width:18%">編碼</th><th>關鍵字（逗號分隔）</th><th style="width:60px"></th></tr></thead>
        <tbody id="mapBody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ---------- 對照表 ----------
const DEFAULT_MAP = [
  { name: '公共意外險', code: '150215PL', keywords: ['公共意外險', '公共意外責任險', '公共意外責任保險'] },
  { name: '營繕承包人意外責任險', code: '150215CL', keywords: ['營繕承包人意外責任', '營繕承包人意外責任險', '營繕承包人意外責任保險'] },
  { name: '雇主意外責任險', code: '150215EL', keywords: ['雇主意外責任險', '雇主意外責任保險'] },
  { name: '產品責任險', code: '150215PD', keywords: ['產品責任險', '產品責任保險'] }
];
const STORE_KEY = 'policyCodeMap.v1';
let MAP = loadMap();

function loadMap() {
  const defs = JSON.parse(JSON.stringify(DEFAULT_MAP));
  try {
    const m = JSON.parse(localStorage.getItem(STORE_KEY));
    if (Array.isArray(m) && m.length) {
      // 已存的對照表保留使用者的修改，但補上新版預設裡還沒有的險種
      const codes = new Set(m.map(x => x.code));
      return m.concat(defs.filter(d => !codes.has(d.code)));
    }
  } catch (e) {}
  return defs;
}
function saveMap() { try { localStorage.setItem(STORE_KEY, JSON.stringify(MAP)); } catch (e) {} }

function renderMap() {
  const tb = document.getElementById('mapBody');
  tb.innerHTML = '';
  MAP.forEach((m, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input type="text" data-k="name" value="${esc(m.name)}"></td>
      <td><input type="text" data-k="code" class="code" value="${esc(m.code)}"></td>
      <td><input type="text" data-k="keywords" value="${esc((m.keywords || []).join(', '))}"></td>
      <td><button title="刪除">刪除</button></td>`;
    tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
      const k = inp.dataset.k;
      if (k === 'keywords') MAP[i].keywords = splitKw(inp.value);
      else MAP[i][k] = inp.value.trim();
      saveMap();
    }));
    tr.querySelector('button').onclick = () => { if (confirm(`刪除「${m.name}」？`)) { MAP.splice(i, 1); saveMap(); renderMap(); } };
    tb.appendChild(tr);
  });
}
function splitKw(s) { return s.split(/[,，、;；\n]/).map(x => x.trim()).filter(Boolean); }
function keywordsOf(m) { const k = (m.keywords || []).slice(); if (m.name && !k.includes(m.name)) k.unshift(m.name); return k; }

document.getElementById('addRow').onclick = () => { MAP.push({ name: '', code: '', keywords: [] }); saveMap(); renderMap(); };
document.getElementById('exportMap').onclick = () => download('險種對照表.json', JSON.stringify(MAP, null, 2), 'application/json');
document.getElementById('importMap').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const txt = (await f.text()).replace(/^﻿/, '');
  try {
    let list;
    if (f.name.toLowerCase().endsWith('.json')) list = JSON.parse(txt);
    else list = txt.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(',')).filter(c => c[1] && !/^編碼$/.test(c[1].trim()))
      .map(c => ({ name: c[0].trim(), code: c[1].trim(), keywords: splitKw(c.slice(2).join(',')) }));
    if (!Array.isArray(list) || !list.length) throw new Error('沒有資料');
    MAP = list; saveMap(); renderMap(); alert(`已匯入 ${list.length} 筆險種`);
  } catch (err) { alert('匯入失敗：' + err.message); }
  e.target.value = '';
};

// ---------- 文字正規化與比對 ----------
function normalize(s) {
  return s
    .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)) // 全形轉半形
    .replace(/\s+/g, '')       // OCR 常在中文字間插入空白
    .replace(/[險]/g, '險')
    .toUpperCase();
}
// OCR 常認錯的相似字（字形接近），算半個錯字
const CONFUSABLE = ['責貴賁債具員貢焉', '任仕住', '險檢驗儉', '保堡你係', '意憲', '外夕', '共其', '公分', '營螢', '繕膳', '雇僱選', '書晝畫守', '產彥', '物沕', '承丞', '包句', '造違', '綜粽', '合含', '業棠', '主王', '人入八', '電雷', '梯稀', '品晶', '專傳', '竊竄', '盜盗'];
const CONF = new Map();
CONFUSABLE.forEach(g => { for (const a of g) for (const b of g) if (a !== b) CONF.set(a + b, 0.5); });
const subCost = (a, b, confCost = 0.5) => a === b ? 0 : (CONF.has(a + b) ? confCost : 1);
// confCost：相似字的成本。設成 0 可算出「扣掉相似字之後」還有幾個真正的錯字
function lev(a, b, confCost = 0.5) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + subCost(a[i - 1], b[j - 1], confCost));
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
// 在文字中找關鍵字最接近的位置，回傳錯字數 dist（相似字算 0.5）
function nearest(text, kw) {
  const k = normalize(kw); if (!k) return null;
  const idx = text.indexOf(k);
  if (idx >= 0) return { dist: 0, index: idx, len: k.length, klen: k.length };
  let best = null;
  for (let w = Math.max(1, k.length - 2); w <= k.length + 2; w++)
    for (let i = 0; i + w <= text.length; i++) {
      const d = lev(text.substr(i, w), k);
      if (!best || d < best.dist) best = { dist: d, index: i, len: w, klen: k.length };
    }
  if (best) best.strict = lev(text.substr(best.index, best.len), k, 0); // 不算相似字的錯字數
  return best;
}
// 容許的錯字數：關鍵字越長容許越多（8 字的「公共意外責任保險」可錯 2 個字）
const allowedDist = L => L >= 7 ? 2 : L >= 5 ? 1 : 0;

// 對照表以外的其他險種名稱：只用來判斷「比較像哪一個」，避免把別的險種誤判成對照表裡的險種
const OTHER_TYPES = ['雇主意外責任保險', '營繕承包人意外責任保險', '營造綜合保險', '安裝工程綜合保險', '電梯意外責任保險',
  '產品責任保險', '專業責任保險', '醫師業務責任保險', '旅行業責任保險', '商業火災保險', '住宅火災保險', '竊盜損失保險',
  '現金保險', '員工誠實保證保險', '意外傷害保險', '個人責任保險', '停車場責任保險', '保全業責任保險', '大樓管理責任保險',
  '機械保險', '營造機具綜合保險', '第三人責任保險', '公共意外責任保險'];

// 找出要保書的標題，例如「國泰產物公共意外責任保險要保書」。險種以標題為準，
// 內文提到的其他險種（例如條款說明、勾選清單）不算。
function findTitle(text) {
  const re = /([一-鿿]{2,30}?)要[保係你][書晝畫守]/g; let m;
  while ((m = re.exec(text))) if (/[險檢驗儉]/.test(m[1])) return { title: m[1], index: m.index };
  return null;
}
function classify(text) {
  const t = findTitle(text);
  const scope = t ? t.title : text, offset = t ? t.index : 0;
  const mapped = new Set(MAP.flatMap(m => keywordsOf(m).map(normalize)));
  // 其他險種中，跟標題最接近的距離
  let otherBest = Infinity, otherName = '';
  for (const o of OTHER_TYPES) {
    if (mapped.has(normalize(o))) continue;
    const r = nearest(scope, o);
    // 只有本身也夠像的才算競爭者（避免「現金保險」只靠「保險」兩字就被算進來）
    if (r && r.dist <= allowedDist(r.klen) && r.dist < otherBest) { otherBest = r.dist; otherName = o; }
  }
  // 對照表裡每個險種與標題的最近距離
  const cands = [];
  for (const m of MAP) {
    if (!m.code) continue;
    let best = null, bestKw = '';
    for (const kw of keywordsOf(m)) {
      const r = nearest(scope, kw);
      if (r && (!best || r.dist < best.dist || (r.dist === best.dist && r.klen > best.klen))) { best = r; bestKw = kw; }
    }
    if (best) cands.push({ m, best, bestKw });
  }
  cands.sort((a, b) => a.best.dist - b.best.dist || b.best.klen - a.best.klen);
  const hits = [];
  const top = cands[0];
  if (top) {
    const { m, best, bestKw } = top;
    // 競爭者：其他對照表險種 + 對照表以外的險種，只算本身也夠像的
    let rival = otherBest;
    for (const c of cands.slice(1)) if (c.m.code !== m.code && c.best.dist <= allowedDist(c.best.klen)) rival = Math.min(rival, c.best.dist);
    const ok = best.dist === 0 ||
      (best.dist <= (t ? allowedDist(best.klen) : Math.min(1, allowedDist(best.klen))) // 找不到標題時從嚴
        && rival - best.dist >= 1); // 必須明顯比其他險種更像
    if (ok) hits.push({ index: best.index + offset, len: best.len, dist: best.dist,
      score: 1 - best.dist / best.klen,
      // 完全相符，或錯的字全都是 OCR 常見的相似字（例如 責→貴、雇→選）→ 直接算符合
      exact: best.dist === 0 || best.strict === 0,
      corrected: best.dist > 0 && best.strict === 0,
      name: m.name, code: m.code, kw: bestKw });
  }
  return { hits, title: t ? t.title : '', otherName: hits.length || otherBest > 1 ? '' : otherName };
}

// ---------- PDF 讀取 / OCR ----------
let ocrWorker = null;
async function getWorker() {
  if (!ocrWorker) {
    setStatus('第一次使用 OCR，正在下載繁體中文辨識模型（約 10 MB，之後會快取）…');
    ocrWorker = await Tesseract.createWorker('chi_tra');
  }
  return ocrWorker;
}
// 一頁一頁讀：一個 PDF 裡可能有好幾份不同險種的要保書（例如送件清單 + 公共意外 + 營繕 + 雇主…），
// 每一頁各自判斷險種、各自找「保險單號碼」欄位。
const OCR_TOP = 0.45; // 只 OCR 頁面上方 45%（標題和保險單號碼都在上方），速度快一倍以上
async function readPdf(file, onProgress) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const forceOcr = document.getElementById('forceOcr').checked;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    let pageText = '', pageChars = [], usedOcr = false;
    if (!forceOcr) {
      const tc = await page.getTextContent();
      pageText = tc.items.map(it => it.str).join('');
      for (const it of tc.items) {
        const s = [...it.str]; if (!s.length) continue;
        const size = Math.hypot(it.transform[0], it.transform[1]) || 9, cw = (it.width || size * s.length) / s.length;
        s.forEach((c, k) => pageChars.push({ c, page: p - 1, x0: it.transform[4] + cw * k, x1: it.transform[4] + cw * (k + 1), y: it.transform[5], size }));
      }
    }
    // 頁面沒有「要保書」字樣（掃描圖，或表格字樣是圖形、只有填寫的資料是文字）→ 做 OCR，和原有文字合併
    const nt = normalize(pageText);
    if (!/要保/.test(nt)) {
      onProgress(`第 ${p}/${pdf.numPages} 頁 OCR 中…`);
      const vp = page.getViewport({ scale: 2.5 });
      const canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = Math.ceil(vp.height * OCR_TOP);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      const w = await getWorker();
      const { data } = await w.recognize(canvas);
      const textChars = pageChars; pageChars = [];
      for (const wd of (data.words || [])) {
        const s = [...wd.text]; if (!s.length) continue;
        const [ax, ay] = vp.convertToPdfPoint(wd.bbox.x0, wd.bbox.y1), [bx, by] = vp.convertToPdfPoint(wd.bbox.x1, wd.bbox.y0);
        const cw = (bx - ax) / s.length, size = Math.abs(by - ay);
        s.forEach((c, k) => pageChars.push({ c, page: p - 1, x0: ax + cw * k, x1: ax + cw * (k + 1), y: Math.min(ay, by), size }));
      }
      pageChars.push(...textChars); // OCR 文字放前面（標題、欄位名稱），PDF 原有文字放後面
      pageText = data.text + '\n' + pageText; usedOcr = true;
    } else onProgress(`第 ${p}/${pdf.numPages} 頁讀取文字…`);
    pages.push({ page: p, text: pageText, chars: pageChars, usedOcr });
  }
  pages.pdf = pdf;
  return pages;
}

// 第二次 OCR（只在找不到保險單號碼欄位時）：放大、去掉紅字、用「零散文字」模式，
// 再找最像「保險單號碼 字第 號本單係 字第 號續保」的那一行
const FIELD_ROW = '保險單號碼字第號本單係字第號續保';
async function ocrFieldPass(pdf, p) {
  const page = await pdf.getPage(p);
  const vp = page.getViewport({ scale: 3 });
  const canvas = document.createElement('canvas');
  canvas.width = vp.width; canvas.height = Math.ceil(vp.height * 0.3);
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const orig = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const w = await getWorker();
  // 先用較深的門檻；影印得很淡的（字是淺灰藍色）找不到時，再用較淺的門檻試一次
  for (const lumMax of [170, 215]) {
    const im = new ImageData(new Uint8ClampedArray(orig.data), orig.width, orig.height), d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const keep = 0.3 * r + 0.59 * g + 0.11 * b < lumMax && r - Math.max(g, b) <= 40; // 深色、非紅色
      d[i] = d[i + 1] = d[i + 2] = keep ? 0 : 255;
    }
    ctx.putImageData(im, 0, 0);
    await w.setParameters({ tessedit_pageseg_mode: '11' });
    let data;
    try { ({ data } = await w.recognize(canvas)); } finally { await w.setParameters({ tessedit_pageseg_mode: '3' }); }
    const row = findFieldRow(ocrWords(data, vp));
    if (!row) continue;
    // 找到那一行之後，只把那一行放大到 5 倍，用「單行」模式再 OCR 一次，才認得到第一個「字第」
    const yTop = Math.max(...row.words.map(w => w.y + w.size)) + 3, yBot = Math.min(...row.words.map(w => w.y)) - 3;
    const band = await ocrBand(page, yTop, yBot, w, lumMax);
    const pos = (band.length && pickFieldPos(band, p - 1)) || pickFieldPos(row.words, p - 1);
    if (pos) return pos;
  }
  return null;
}
function ocrWords(data, vp) {
  const words = [];
  for (const wd of (data.words || [])) {
    const t = normalize(wd.text); if (!t) continue;
    const [ax, ay] = vp.convertToPdfPoint(wd.bbox.x0, wd.bbox.y1), [bx, by] = vp.convertToPdfPoint(wd.bbox.x1, wd.bbox.y0);
    words.push({ t, x0: Math.min(ax, bx), x1: Math.max(ax, bx), y: Math.min(ay, by), size: Math.abs(by - ay) });
  }
  return words;
}
// 把 PDF 座標 yTop~yBot 這一條橫帶放大後 OCR（單行模式）
async function ocrBand(page, yTop, yBot, worker, lumMax = 175) {
  const s = 5, vp = page.getViewport({ scale: s });
  const [, top] = vp.convertToViewportPoint(0, yTop), [, bot] = vp.convertToViewportPoint(0, yBot);
  const h = Math.max(10, Math.ceil(bot - top));
  const canvas = document.createElement('canvas');
  canvas.width = vp.width; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.translate(0, -top);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const im = ctx.getImageData(0, 0, canvas.width, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const keep = 0.3 * r + 0.59 * g + 0.11 * b < lumMax + 5 && r - Math.max(g, b) <= 40;
    d[i] = d[i + 1] = d[i + 2] = keep ? 0 : 255;
  }
  ctx.putImageData(im, 0, 0);
  await worker.setParameters({ tessedit_pageseg_mode: '7' });
  let data;
  try { ({ data } = await worker.recognize(canvas)); } finally { await worker.setParameters({ tessedit_pageseg_mode: '3' }); }
  return ocrWords(data, { convertToPdfPoint: (x, y) => vp.convertToPdfPoint(x, y + top) });
}
// 從頁面影像找出欄位所在的表格格子：左邊的直線（欄位名稱格的右框）、上下兩條橫線。
// 有了格子，編碼就能放在格子正中間，不會壓到框線或欄位名稱。
async function refineCell(pdf, pos) {
  const page = await pdf.getPage(pos.page + 1);
  const s = 3, vp = page.getViewport({ scale: s });
  const [, top] = vp.convertToViewportPoint(0, pos.y + pos.size + 16), [, bot] = vp.convertToViewportPoint(0, pos.y - 14);
  const h = Math.ceil(bot - top);
  const canvas = document.createElement('canvas');
  canvas.width = vp.width; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, h);
  ctx.translate(0, -top);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const d = ctx.getImageData(0, 0, canvas.width, h).data, W = canvas.width;
  const dark = (x, y) => { const i = (y * W + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2]; return 0.3 * r + 0.59 * g + 0.11 * b < 200 && r - Math.max(g, b) <= 40; };
  const [xL] = vp.convertToViewportPoint(pos.x - 6, 0), [xR] = vp.convertToViewportPoint(pos.gapEnd - 2, 0);
  const x0 = Math.max(0, Math.round(xL)), x1 = Math.min(W - 1, Math.round(xR));
  if (x1 - x0 < 20) return null;
  // 橫線：整段都是深色的列
  const lines = [];
  for (let y = 0; y < h; y++) {
    let n = 0; for (let x = x0; x <= x1; x++) if (dark(x, y)) n++;
    if (n / (x1 - x0 + 1) > 0.8) lines.push(y);
  }
  const cy = vp.convertToViewportPoint(0, pos.y + pos.size * 0.4)[1] - top; // 換算成這條橫帶裡的座標
  const above = lines.filter(y => y < cy).pop(), below = lines.find(y => y > cy);
  if (above == null || below == null || below - above < 6 * s || below - above > 30 * s) return null;
  // 直線：在上下橫線之間幾乎整段都是深色的欄（取最右邊那條，就是欄位名稱格的右框）
  let border = null;
  for (let x = x0; x <= x1 - 10 * s; x++) {
    let n = 0; for (let y = above + 2; y < below - 1; y++) if (dark(x, y)) n++;
    if (n / Math.max(1, below - above - 3) > 0.85) border = x;
  }
  const toPt = (x, y) => vp.convertToPdfPoint(x, y + top);
  return { top: toPt(0, above)[1], bottom: toPt(0, below)[1], border: border == null ? null : toPt(border, 0)[0] };
}

// 找出最像「保險單號碼 字第 號本單係 字第 號續保」的那一行
function findFieldRow(words) {
  const rows = [];
  for (const w of [...words].sort((a, b) => b.y - a.y)) {
    const r = rows.find(r => Math.abs(r.y - w.y) < Math.max(5, w.size * 0.8));
    if (r) r.words.push(w); else rows.push({ y: w.y, words: [w] });
  }
  let best = null;
  for (const r of rows) {
    r.words.sort((a, b) => a.x0 - b.x0);
    const cjk = r.words.map(w => w.t.replace(/[^一-鿿]/g, '')).join('');
    if (cjk.length < 3) continue;
    // 至少要有 3 種「保險單號碼字第本續」裡的字，才可能是這一行
    if (new Set([...cjk].filter(c => FIELD_ROW.includes(c))).size < 3) continue;
    const d = lev(cjk, FIELD_ROW) / Math.max(cjk.length, FIELD_ROW.length);
    if (!best || d < best.d) best = { d, r };
  }
  return best && best.d <= 0.8 ? best.r : null;
}
// 這一行的版面固定是 5 組字，中間隔著空白：[保險單號碼] [字第] [號本單係] [字第] [號續保]。
// OCR 常把小字認錯（「字第」可能變成「全」「生弟」「3第」），所以不靠字，靠位置：
// 欄位名稱後面第一組短短的字就是「字第」，編碼放在它左邊。
function pickFieldPos(words, pageIndex) {
  const ws = [...words].sort((a, b) => a.x0 - b.x0);
  if (ws.length < 2) return null;
  const groups = [];
  for (const w of ws) {
    const g = groups[groups.length - 1];
    if (g && w.x0 - g.x1 < 15) { g.words.push(w); g.x1 = Math.max(g.x1, w.x1); g.t += w.t; }
    else groups.push({ words: [w], x0: w.x0, x1: w.x1, t: w.t });
  }
  if (groups.length < 2) return null;
  let filled = false, target = null;
  for (const g of groups.slice(1)) {
    const t = g.t.replace(/[|「」『』,.。、:;'"()\-_/]/g, '');
    if (!t) continue;                                                  // 表格線等雜訊
    if (/^[0-9A-Z]{4,}$/.test(t)) { filled = true; continue; }        // 欄位裡已有號碼
    if (g.x1 - g.x0 < 42 || /[字子第弟]/.test(t)) { target = g; break; }
    return null; // 欄位名稱後面直接接了一大段字 → 版面不是預期的樣子
  }
  if (!target) return null;
  const y = Math.min(...target.words.map(w => w.y)); // 字的底線
  const size = Math.max(...target.words.map(w => w.size));
  return { page: pageIndex, x: Math.min(groups[0].x1, target.x0 - 30), y, size, gapEnd: target.x0,
    fallback: true, rightAlign: true, filledHint: filled };
}

// 欄位裡是否已經有號碼（例如已經填好 150214PD07591 的要保書）
function fieldHasValue(chars, pos) {
  return chars.some(ch => /[0-9A-Za-z]/.test(ch.c) && Math.abs(ch.y - pos.y) < pos.size * 0.8 &&
    ch.x0 > pos.x + 1 && ch.x1 < pos.gapEnd - 1);
}

// 找到欄位名稱（例如「保險單號碼」）的位置，回傳要寫入編碼的空白區
function locateField(chars, label) {
  const lab = normalize(label); if (!lab) return null;
  const seq = chars.filter(ch => normalize(ch.c));
  const str = seq.map(ch => normalize(ch.c)).join('');
  const idx = str.indexOf(lab);
  if (idx < 0) {
    // 掃描檔 OCR 常漏掉字距很寬的「保 險 單 號 碼」，改用欄位後面的「字第」定位：編碼寫在「字第」左邊的空格
    // 只認同一行後面接著「本單係」的那個「字第」（避免抓到抬頭的「國產精字第…號」）
    const k = str.indexOf('本單係'); if (k < 0) return null;
    const j = str.lastIndexOf('字第', k); if (j < 0) return null;
    const a = seq[j];
    if (Math.abs(a.y - seq[k].y) > a.size || k - j > 40) return null;
    return { page: a.page, x: a.x0 - 62, y: a.y, size: a.size, gapEnd: a.x0, fallback: true };
  }
  // seq 與 str 一字對一字（normalize 單字只會變成 0 或 1 個字）
  const last = seq[idx + lab.length - 1];
  const next = seq.slice(idx + lab.length).find(ch => ch.page === last.page && Math.abs(ch.y - last.y) < last.size * 0.6 && ch.x0 > last.x1);
  return { page: last.page, x: last.x1, y: last.y, size: last.size, gapEnd: next ? next.x0 : last.x1 + 150 };
}

// 把勾選的每一頁各自的編碼填入，匯出成一個 PDF
async function exportFilled(r) {
  const items = r.forms.filter(f => f.selected && f.hit && f.pos);
  if (!items.length) { alert(`「${r.file}」沒有勾選要填入的頁面。`); return; }
  const doc = await PDFLib.PDFDocument.load(await r.fileObj.arrayBuffer(), { ignoreEncryption: true });
  const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  const pages = doc.getPages();
  for (const f of items) {
    const { pos } = f, code = f.hit.code;
    const cell = pos.cell;
    // 可用的寬度：左邊是欄位名稱格的右框（找不到就用欄位名稱結尾），右邊是「字第」
    const left = cell && cell.border != null ? cell.border + 3 : pos.x + (pos.rightAlign ? 8 : 2);
    const right = pos.gapEnd - 3;
    let size = parseFloat(document.getElementById('fontSize').value) || 10;
    while (size > 6 && font.widthOfTextAtSize(code, size) > right - left) size -= 0.5; // 空間不夠就縮小字
    const tw = font.widthOfTextAtSize(code, size);
    const x = right - left > tw ? left + (right - left - tw) / 2 : left;
    // 垂直位置：找得到格子上下框線就放在正中間，否則對齊欄位名稱的底線
    const y = cell ? (cell.top + cell.bottom) / 2 - size * 0.35 : pos.y;
    pages[pos.page].drawText(code, { x, y, size, font, color: PDFLib.rgb(0, 0, 0) });
  }
  const bytes = await doc.save();
  const codes = [...new Set(items.map(f => f.hit.code))].join('_');
  download(r.file.replace(/\.pdf$/i, '') + `_${codes}.pdf`, bytes, 'application/pdf');
  setStatus(`已匯出「${r.file}」，填入 ${items.length} 頁：` + items.map(f => `第${f.page}頁 ${f.hit.code}`).join('、'));
}

// ---------- 介面 ----------
const RESULTS = [];
function setStatus(s) { document.getElementById('status').textContent = s; }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

async function handleFiles(files) {
  files = [...files].filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (!files.length) return;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const prefix = `(${i + 1}/${files.length}) ${f.name}：`;
    try {
      const pages = await readPdf(f, s => setStatus(prefix + s));
      const label = document.getElementById('fieldLabel').value.trim();
      const forms = [];
      for (const pg of pages) {
        const norm = normalize(pg.text);
        const { hits, title, otherName } = classify(norm);
        if (!title) continue; // 這頁不是要保書（送件清單、問卷、說明…）
        const hit = hits[0] || null;
        let pos = locateField(pg.chars, label), filled = pos ? fieldHasValue(pg.chars, pos) : false;
        if (!pos && hit) {
          setStatus(prefix + `第 ${pg.page} 頁再次 OCR 找保險單號碼欄位…`);
          pos = await ocrFieldPass(pages.pdf, pg.page);
          filled = !!(pos && pos.filledHint);
        }
        if (pos) { try { pos.cell = await refineCell(pages.pdf, pos); } catch (e) { pos.cell = null; } }
        forms.push({ page: pg.page, title, otherName, hit, pos, filled, usedOcr: pg.usedOcr, norm,
          // 預設勾選：險種完全相符、找得到欄位、欄位還是空的
          selected: !!(hit && hit.exact && pos && !filled) });
      }
      RESULTS.push({ file: f.name, fileObj: f, pages: pages.length, forms,
        raw: pages.map(pg => `── 第 ${pg.page} 頁 ──\n` + pg.text).join('\n') });
    } catch (err) {
      RESULTS.push({ file: f.name, forms: [], error: err.message || String(err) });
    }
    renderResults();
  }
  setStatus(`完成，共處理 ${files.length} 個檔案。`);
}

function renderResults() {
  const tb = document.getElementById('results');
  document.getElementById('exportCsv').disabled = !RESULTS.length;
  if (!RESULTS.length) { tb.innerHTML = '<tr><td colspan="5" class="muted">尚未上傳檔案</td></tr>'; return; }
  tb.innerHTML = '';
  RESULTS.forEach((r, ri) => {
    const textBox = r.raw ? `<details><summary class="muted">查看讀到的文字</summary><pre>${esc(r.raw)}</pre></details>` : '';
    const nSel = (r.forms || []).filter(f => f.selected).length;
    // 檔案標題列：檔名 + 匯出按鈕
    tb.insertAdjacentHTML('beforeend', `<tr style="background:var(--bg)"><td colspan="5">
      <div class="row" style="justify-content:space-between"><div><b>${esc(r.file)}</b>
      <span class="muted">${r.error ? '' : `共 ${r.pages} 頁，找到 ${r.forms.length} 份要保書`}</span></div>
      ${r.error ? '' : `<button class="primary" data-fill="${ri}" ${nSel ? '' : 'disabled'}>填入勾選的 ${nSel} 頁並匯出 PDF</button>`}</div>${textBox}</td></tr>`);
    if (r.error || !r.forms.length) {
      tb.insertAdjacentHTML('beforeend', `<tr><td>—</td><td>—</td><td>—</td><td><span class="tag bad">${r.error ? '讀取失敗' : '找不到要保書'}</span></td><td class="snip">${esc(r.error || '')}</td></tr>`);
      return;
    }
    r.forms.forEach((f, fi) => {
      const h = f.hit, src = f.usedOcr ? 'OCR' : 'PDF 文字';
      let tag, note = '要保書標題：' + esc(f.title);
      if (!h) {
        tag = `<span class="tag bad">對照表沒有此險種</span>`;
        if (f.otherName) note += `<br>看起來是「${esc(f.otherName)}」`;
      } else if (!f.pos) {
        tag = `<span class="tag bad">找不到保險單號碼欄位</span>`;
      } else if (f.filled) {
        tag = `<span class="tag warn">欄位已有號碼，預設不填</span>`;
      } else tag = h.exact ? `<span class="tag ok">符合${h.corrected ? '（已校正 OCR 錯字）' : ''}</span>`
        : `<span class="tag warn">OCR 有錯字，判斷為此險種，請確認 ${Math.round(h.score * 100)}%</span>`;
      if (f.pos && f.pos.fallback) note += '<br>（沒認到「保險單號碼」字樣，依「字第」位置填入）';
      const canFill = !!(h && f.pos);
      tb.insertAdjacentHTML('beforeend', `<tr>
        <td><label class="chk"><input type="checkbox" data-sel="${ri}:${fi}" ${f.selected ? 'checked' : ''} ${canFill ? '' : 'disabled'}> 第 ${f.page} 頁</label><div class="muted">${src}</div></td>
        <td>${h ? esc(h.name) : '—'}</td>
        <td>${h ? `<span class="code">${esc(h.code)}</span>` : '—'}</td>
        <td>${tag}</td>
        <td class="snip">${note}</td></tr>`);
    });
  });
  tb.querySelectorAll('[data-sel]').forEach(cb => cb.onchange = () => {
    const [ri, fi] = cb.dataset.sel.split(':').map(Number);
    RESULTS[ri].forms[fi].selected = cb.checked; renderResults();
  });
  tb.querySelectorAll('[data-fill]').forEach(b => b.onclick = async () => {
    const r = RESULTS[+b.dataset.fill];
    const unsure = r.forms.filter(f => f.selected && f.hit && !f.hit.exact);
    if (unsure.length && !confirm('以下頁面的險種不是完全相符，確定要填入？\n' + unsure.map(f => `第${f.page}頁 → ${f.hit.code}`).join('\n'))) return;
    b.disabled = true;
    try { await exportFilled(r); }
    catch (e) { alert('匯出失敗：' + (e.message || e)); }
    b.disabled = false;
  });
  tb.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = '已複製'; setTimeout(() => b.textContent = '複製', 1200); } catch (e) {}
  });
}

function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function csvCell(v) { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
document.getElementById('exportCsv').onclick = () => {
  const rows = [['檔案', '頁', '要保書標題', '險種', '編碼', '狀態', '辨識方式']];
  RESULTS.forEach(r => {
    if (r.error || !r.forms.length) { rows.push([r.file, '', '', '', '', r.error ? '讀取失敗' : '找不到要保書', '']); return; }
    r.forms.forEach(f => {
      const h = f.hit;
      const st = !h ? '對照表沒有此險種' : !f.pos ? '找不到保險單號碼欄位' : f.filled ? '欄位已有號碼'
        : h.exact ? '符合' : `待人工確認(${Math.round(h.score * 100)}%)`;
      rows.push([r.file, f.page, f.title, h ? h.name : '', h ? h.code : '', st, f.usedOcr ? 'OCR' : 'PDF文字']);
    });
  });
  download('險種辨識結果.csv', '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
};
document.getElementById('clear').onclick = () => { RESULTS.length = 0; renderResults(); setStatus(''); };

const drop = document.getElementById('drop'), fileInput = document.getElementById('file');
drop.onclick = () => fileInput.click();
fileInput.onchange = () => { handleFiles(fileInput.files); fileInput.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('hover'); };
drop.ondragleave = () => drop.classList.remove('hover');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('hover'); handleFiles(e.dataTransfer.files); };

renderMap();
</script>
</body>
